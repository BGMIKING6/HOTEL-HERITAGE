<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Hotel Heritage &amp; Marriage Hall — Coming Soon</title>
<meta name="description" content="The Hotel Heritage & Marriage Hall — our new website is under construction. Check back soon." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ivory: #F7F3EC;
    --charcoal: #0F1420;
    --charcoal2: #151b28;
    --gold: #C79A4B;
    --gold-light: #E4C583;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 20%, var(--charcoal2), var(--charcoal) 70%);
    color: var(--ivory);
    font-family: 'Manrope', sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px 40px;
    overflow-x: hidden;
  }

  /* subtle noise / vignette */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 640px;
  }

  .logo {
    width: 168px;
    max-width: 46vw;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
    opacity: 0;
    animation: fadeUp 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  .eyebrow {
    margin-top: 34px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold-light);
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
    animation-delay: 0.35s;
  }

  h1 {
    margin: 18px 0 0;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height: 1.05;
    letter-spacing: 0.01em;
    opacity: 0;
    animation: fadeUp 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
    animation-delay: 0.5s;
  }

  .sub {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(247,243,236,0.55);
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
    animation-delay: 0.65s;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: var(--gold);
    margin: 30px 0;
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 0.8s;
  }

  .message {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    color: rgba(247,243,236,0.85);
    max-width: 420px;
    line-height: 1.5;
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
    animation-delay: 0.95s;
  }

  .status {
    margin-top: 30px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(247,243,236,0.4);
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 1.1s;
  }

  .status strong {
    color: var(--gold-light);
    font-weight: 500;
  }

  .contact {
    margin-top: 44px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) forwards;
    animation-delay: 1.25s;
  }

  .contact a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 26px;
    border: 1px solid rgba(247,243,236,0.25);
    color: var(--ivory);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
  }

  .contact a:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--charcoal);
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 56px;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(247,243,236,0.3);
    opacity: 0;
    animation: fadeUp 1s ease forwards;
    animation-delay: 1.4s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="logo.jpg" alt="The Hotel Heritage &amp; Marriage Hall" class="logo" />

    <span class="eyebrow">Welcome To</span>
    <h1>The Hotel Heritage</h1>
    <span class="sub">Hotel &amp; Marriage Hall</span>

    <div class="divider"></div>

    <p class="message">Where every stay becomes a memory.</p>

    <p class="status">Our new website is <strong>under construction</strong> — please check back soon</p>

    <div class="contact">
      <!-- Replace these with your real phone number and email -->
      <a href="tel:+919831834219">Call Us</a>
      <a href="mailto:akg85360@gmail.com">Email Us</a>
    </div>
  </div>

  <footer>&copy; <span id="year"></span> The Hotel Heritage &amp; Marriage Hall</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
